services:
  db:
    image: mysql:8.4
    container_name: quan-nhau-tu-do-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quan_nhau_tu_do
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - quan_nhau_tu_do_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  quan_nhau_tu_do_mysql_data:
